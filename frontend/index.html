<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chatbot</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1c2029;
      --border: #262b36;
      --accent: #d97757;
      --accent-hover: #c96646;
      --text: #e6e6e6;
      --muted: #8b93a3;
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #eab308;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-thumb {
      background: #2a2f3b;
      border-radius: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    /* ---- Sidebar ---- */
    .sidebar {
      width: 264px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 14px;
    }

    .new-chat-btn {
      width: 100%;
      padding: 10px 12px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background .15s;
    }

    .new-chat-btn:hover {
      background: var(--accent-hover);
    }

    .conv-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .conv-item {
      padding: 9px 10px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background .1s, color .1s;
    }

    .conv-item:hover {
      background: var(--panel-2);
      color: var(--text);
    }

    .conv-item.active {
      background: var(--panel-2);
      color: var(--text);
      font-weight: 500;
    }

    .empty-hint {
      color: var(--muted);
      font-size: 12px;
      padding: 10px;
      text-align: center;
    }

    .rag-panel {
      padding: 14px;
      border-top: 1px solid var(--border);
    }

    .rag-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--muted);
      margin-bottom: 10px;
      font-weight: 600;
    }

    .file-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    .file-row input[type=file] {
      flex: 1;
      min-width: 0;
      font-size: 11px;
      color: var(--muted);
    }

    .btn-secondary {
      padding: 7px 10px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      transition: background .15s;
    }

    .btn-secondary:hover {
      background: #252a35;
    }

    .doc-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }

    .doc-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--muted);
    }

    .doc-item .name {
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-dot.ready {
      background: var(--success);
    }

    .status-dot.processing {
      background: var(--warning);
    }

    .status-dot.failed {
      background: var(--danger);
    }

    /* ---- Main ---- */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .topbar h1 {
      font-size: 15px;
      font-weight: 600;
      margin: 0;
      color: var(--text);
    }

    .auth-form {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .auth-form input {
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 13px;
      width: 150px;
    }

    .auth-form input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .auth-form button {
      background: var(--accent);
      border: none;
      color: #fff;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: background .15s;
    }

    .auth-form button:hover {
      background: var(--accent-hover);
    }

    .auth-form button.ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .auth-form button.ghost:hover {
      background: var(--panel-2);
      color: var(--text);
    }

    .user-chip {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .user-email {
      font-size: 13px;
      color: var(--muted);
    }

    .logout-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      transition: all .15s;
    }

    .logout-btn:hover {
      background: var(--panel-2);
      color: var(--text);
      border-color: #3a4152;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
    }

    .messages-inner {
      max-width: 800px;
      margin: 0 auto;
      padding: 28px 24px 8px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      min-height: 100%;
    }

    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 14px;
    }

    .msg-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .msg-row.user {
      justify-content: flex-end;
    }

    .msg-avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .msg-avatar.assistant {
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--accent);
    }

    .msg-avatar.user {
      background: var(--accent);
      color: #fff;
    }

    .msg-body {
      line-height: 1.65;
      word-wrap: break-word;
    }

    .msg-row.assistant .msg-body {
      max-width: calc(100% - 60px);
    }

    .msg-row.user .msg-body {
      max-width: 65%;
      background: var(--accent);
      color: #fff;
      padding: 10px 15px;
      border-radius: 16px 16px 4px 16px;
    }

    .msg-row.assistant .msg-body {
      white-space: pre-wrap;
    }

    .msg-body code {
      background: var(--panel-2);
      padding: 2px 5px;
      border-radius: 5px;
      font-family: Consolas, Monaco, monospace;
      font-size: 0.88em;
    }

    .msg-row.user .msg-body code {
      background: rgba(255, 255, 255, .18);
    }

    .msg-body pre {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      overflow-x: auto;
      margin: 10px 0;
    }

    .msg-body pre code {
      background: none;
      padding: 0;
    }

    .msg-body strong {
      font-weight: 700;
    }

    .typing {
      display: inline-flex;
      gap: 4px;
      padding: 4px 0;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      animation: pulse 1.1s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes pulse {

      0%,
      60%,
      100% {
        opacity: .3;
        transform: scale(0.85);
      }

      30% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .composer-wrap {
      padding: 16px 24px 22px;
      flex-shrink: 0;
    }

    .composer {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 8px 8px 8px 16px;
      transition: border-color .15s;
    }

    .composer:focus-within {
      border-color: #3a4152;
    }

    .composer textarea {
      flex: 1;
      resize: none;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      padding: 8px 0;
      max-height: 160px;
    }

    .composer textarea:focus {
      outline: none;
    }

    .composer textarea::placeholder {
      color: var(--muted);
    }

    .send-btn {
      background: var(--accent);
      border: none;
      color: #fff;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background .15s;
    }

    .send-btn:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .composer-hint {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      margin-top: 8px;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="sidebar">
      <div class="sidebar-header">
        <button class="new-chat-btn" onclick="newChat()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 5v14M5 12h14" />
          </svg>
          New Chat
        </button>
      </div>
      <div class="conv-list" id="convList">
        <div class="empty-hint">No conversations yet</div>
      </div>

      <div class="rag-panel">
        <div class="rag-title">Knowledge base (RAG)</div>
        <div class="file-row">
          <input type="file" id="docFile" accept=".txt,.md,.pdf">
          <button class="btn-secondary" onclick="uploadDocument()">Upload</button>
        </div>
        <div class="doc-list" id="docList">
          <div class="empty-hint">No documents yet</div>
        </div>
      </div>
    </div>

    <div class="main">
      <div class="topbar">
        <h1>Chatbot</h1>
        <div id="authArea"></div>
      </div>

      <div class="messages" id="messagesScroll">
        <div class="messages-inner" id="messages">
          <div class="empty-state">Start a new conversation below</div>
        </div>
      </div>

      <div class="composer-wrap">
        <div class="composer">
          <textarea id="input" rows="1" placeholder="Message the assistant..."></textarea>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Send">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M5 12h14M13 6l6 6-6 6" />
            </svg>
          </button>
        </div>
        <div class="composer-hint">Enter to send · Shift+Enter for a new line</div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:8011';
    let token = localStorage.getItem('chatbot_token') || null;
    let userEmail = localStorage.getItem('chatbot_email') || '';
    let currentConversationId = null;

    function renderAuthArea() {
      const el = document.getElementById('authArea');
      if (token) {
        const initial = (userEmail || '?').charAt(0).toUpperCase();
        el.innerHTML = `
      <div class="user-chip">
        <div class="user-avatar">${escapeHtml(initial)}</div>
        <span class="user-email">${escapeHtml(userEmail)}</span>
        <button class="logout-btn" onclick="logout()">Log out</button>
      </div>`;
      } else {
        el.innerHTML = `
      <div class="auth-form">
        <input id="email" placeholder="email">
        <input id="password" type="password" placeholder="password">
        <button class="ghost" onclick="login()">Log in</button>
        <button onclick="register()">Register</button>
      </div>`;
        document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
      }
    }

    function setSession(newToken, email) {
      token = newToken;
      userEmail = email;
      localStorage.setItem('chatbot_token', token);
      localStorage.setItem('chatbot_email', email);
      renderAuthArea();
      loadConversations();
      loadDocuments();
    }

    function logout() {
      token = null;
      userEmail = '';
      currentConversationId = null;
      localStorage.removeItem('chatbot_token');
      localStorage.removeItem('chatbot_email');
      renderAuthArea();
      document.getElementById('convList').innerHTML = '<div class="empty-hint">No conversations yet</div>';
      document.getElementById('docList').innerHTML = '<div class="empty-hint">No documents yet</div>';
      showEmptyState();
    }

    async function register() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const res = await fetch(`${API_BASE}/api/auth/register`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (res.ok) setSession(data.token, email);
      else alert(data.message || 'Registration failed');
    }

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const res = await fetch(`${API_BASE}/api/auth/login`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (res.ok) setSession(data.token, email);
      else alert(data.message || 'Login failed');
    }

    function authHeaders() {
      return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
    }

    async function loadConversations() {
      if (!token) return;
      const res = await fetch(`${API_BASE}/api/chat/conversations`, { headers: authHeaders() });
      if (!res.ok) return;
      const convs = await res.json();
      const list = document.getElementById('convList');
      if (!convs.length) { list.innerHTML = '<div class="empty-hint">No conversations yet</div>'; return; }
      list.innerHTML = '';
      convs.forEach(c => {
        const div = document.createElement('div');
        div.className = 'conv-item' + (c.id === currentConversationId ? ' active' : '');
        div.textContent = c.title || '(untitled)';
        div.title = c.title || '(untitled)';
        div.onclick = () => openConversation(c.id);
        list.appendChild(div);
      });
    }

    function showEmptyState() {
      document.getElementById('messages').innerHTML = '<div class="empty-state">Start a new conversation below</div>';
    }

    async function openConversation(id) {
      currentConversationId = id;
      const res = await fetch(`${API_BASE}/api/chat/conversations/${id}`, { headers: authHeaders() });
      const data = await res.json();
      document.getElementById('messages').innerHTML = '';
      if (!data.messages.length) showEmptyState();
      else data.messages.forEach(m => appendMessage(m.role.toLowerCase(), m.content));
      loadConversations();
    }

    function newChat() {
      currentConversationId = null;
      showEmptyState();
      loadConversations();
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // Minimal, dependency-free Markdown -> HTML for chat replies (bold, inline
    // code, fenced code blocks, headers). Escapes HTML first so model output
    // can't inject markup; code blocks are pulled out before escaping/formatting
    // the rest so their contents aren't touched by the other rules.
    function renderMarkdown(raw) {
      const codeBlocks = [];
      const marker = i => ` CODEBLOCK${i} `;
      let text = raw.replace(/```(\w*)\n?([\s\S]*?)```/g, (match, lang, code) => {
        codeBlocks.push(`<pre><code>${escapeHtml(code.trim())}</code></pre>`);
        return marker(codeBlocks.length - 1);
      });

      text = escapeHtml(text);
      text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
      text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      text = text.replace(/^#{1,3} (.*)$/gm, '<strong>$1</strong>');
      codeBlocks.forEach((block, i) => { text = text.replace(marker(i), block); });

      return text;
    }

    function appendMessage(role, text) {
      const container = document.getElementById('messages');
      if (container.querySelector('.empty-state')) container.innerHTML = '';

      const row = document.createElement('div');
      row.className = 'msg-row ' + role;

      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar ' + role;
      avatar.textContent = role === 'user' ? (userEmail || '?').charAt(0).toUpperCase() : 'AI';

      const body = document.createElement('div');
      body.className = 'msg-body';
      body.innerHTML = renderMarkdown(text);

      if (role === 'user') { row.appendChild(body); row.appendChild(avatar); }
      else { row.appendChild(avatar); row.appendChild(body); }

      container.appendChild(row);
      scrollToBottom();
      return body;
    }

    function scrollToBottom() {
      const scroller = document.getElementById('messagesScroll');
      scroller.scrollTop = scroller.scrollHeight;
    }

    const input = document.getElementById('input');
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 160) + 'px';
    });

    async function sendMessage() {
      if (!token) { alert('Please log in first'); return; }
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      input.style.height = 'auto';
      document.getElementById('sendBtn').disabled = true;

      appendMessage('user', text);
      const assistantDiv = appendMessage('assistant', '');
      assistantDiv.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
      let assistantRaw = '';
      let firstToken = true;

      try {
        const res = await fetch(`${API_BASE}/api/chat/stream`, {
          method: 'POST',
          headers: authHeaders(),
          body: JSON.stringify({ message: text, conversationId: currentConversationId })
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          const events = buffer.split('\n\n');
          buffer = events.pop();
          for (const evt of events) {
            const lines = evt.split('\n');
            const eventType = lines.find(l => l.startsWith('event:'))?.slice(6).trim();
            const dataLine = lines.find(l => l.startsWith('data:'))?.slice(5);
            if (eventType === 'token' && dataLine !== undefined) {
              if (firstToken) { assistantDiv.innerHTML = ''; firstToken = false; }
              assistantRaw += dataLine;
              assistantDiv.textContent = assistantRaw; // plain text while streaming; formatted once complete below
              scrollToBottom();
            } else if (eventType === 'done' && dataLine) {
              assistantDiv.innerHTML = renderMarkdown(assistantRaw);
              const parsed = JSON.parse(dataLine);
              currentConversationId = parsed.conversationId;
              loadConversations();
            } else if (eventType === 'error') {
              assistantDiv.textContent = 'Something went wrong generating a reply.';
            }
          }
        }
      } catch (e) {
        assistantDiv.textContent = 'Could not reach the server.';
      } finally {
        document.getElementById('sendBtn').disabled = false;
      }
    }

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    async function uploadDocument() {
      if (!token) { alert('Please log in first'); return; }
      const fileInput = document.getElementById('docFile');
      if (!fileInput.files.length) { alert('Choose a file first'); return; }
      const formData = new FormData();
      formData.append('file', fileInput.files[0]);

      const res = await fetch(`${API_BASE}/api/documents`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}` }, // no Content-Type - browser sets multipart boundary
        body: formData
      });
      const data = await res.json();
      if (!res.ok) { alert(data.message || 'Upload failed (is RAG_ENABLED=true on the server?)'); return; }
      fileInput.value = '';
      loadDocuments();
    }

    async function loadDocuments() {
      if (!token) return;
      const res = await fetch(`${API_BASE}/api/documents`, { headers: authHeaders() });
      if (!res.ok) return;
      const docs = await res.json();
      const list = document.getElementById('docList');
      if (!docs.length) { list.innerHTML = '<div class="empty-hint">No documents yet</div>'; return; }
      list.innerHTML = docs.map(d => `
    <div class="doc-item">
      <span class="status-dot ${d.status.toLowerCase()}"></span>
      <span class="name">${escapeHtml(d.filename)}</span>
    </div>`).join('');
    }

    renderAuthArea();
    if (token) { loadConversations(); loadDocuments(); }
  </script>
</body>

</html>
